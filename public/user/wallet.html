<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - HomeSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white shadow-lg fixed left-0 top-0 bottom-0 overflow-y-auto">
            <div class="p-6">
                <h1
                    class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                    HomeSphere</h1>
                <p class="text-xs text-gray-500 mt-1">15-Min Smart Service</p>
            </div>
            <nav class="px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100"><i
                        class="fas fa-home"></i><span>Dashboard</span></a>
                <a href="booking.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100"><i
                        class="fas fa-calendar-check"></i><span>My Bookings</span></a>
                <a href="wallet.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white"><i
                        class="fas fa-wallet"></i><span>Wallet</span></a>
                <a href="subscription.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100"><i
                        class="fas fa-crown"></i><span>Subscription</span></a>

                <a href="chatbot.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100"><i
                        class="fas fa-robot"></i><span>AI Assistant</span></a>
            </nav>
        </aside>

        <main class="flex-1 ml-64 overflow-y-auto">
            <header class="bg-white shadow-sm sticky top-0 z-10">
                <div class="flex items-center justify-between px-8 py-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">My Wallet</h2>
                        <p class="text-sm text-gray-500">Manage your payments and transactions</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-3">
                            <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff"
                                id="userProfileImg" alt="Profile" class="w-10 h-10 rounded-full">
                            <div>
                                <p class="text-sm font-semibold text-gray-800" id="userProfileName">Loading...</p>
                                <p class="text-xs text-gray-500">Premium Member</p>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-8">
                <div class="bg-gradient-to-br from-indigo-600 to-purple-600 rounded-2xl shadow-2xl p-8 text-white mb-8">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <p class="text-sm opacity-90 mb-2">Total Balance</p>
                            <h2 class="text-5xl font-bold" id="totalBalance">₹0</h2>
                        </div>
                        <div class="w-20 h-20 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
                            <i class="fas fa-wallet text-4xl"></i>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-white bg-opacity-10 rounded-xl p-4">
                            <p class="text-xs opacity-80 mb-1">Cashback Available</p>
                            <p class="text-2xl font-bold" id="cashbackBalance">₹0</p>
                        </div>
                        <div class="bg-white bg-opacity-10 rounded-xl p-4">
                            <p class="text-xs opacity-80 mb-1">Pending Refunds</p>
                            <p class="text-2xl font-bold">₹0</p>
                        </div>
                    </div>
                    <div class="flex space-x-3">
                        <button onclick="openAddMoneyModal()"
                            class="flex-1 bg-white text-indigo-600 py-3 rounded-xl font-bold hover:shadow-lg">
                            <i class="fas fa-plus-circle mr-2"></i>Add Money
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-lg p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold text-gray-800">Recent Transactions</h3>
                        <button class="text-indigo-600 text-sm font-semibold hover:underline">View All</button>
                    </div>
                    <div class="space-y-4" id="transactionsList">
                        <div class="text-center py-6 text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i>Loading
                            transactions...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Money Modal -->
    <div id="addMoneyModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Add Money</h3>
                <button onclick="closeAddMoneyModal()" class="text-gray-400 hover:text-gray-600"><i
                        class="fas fa-times text-xl"></i></button>
            </div>
            <form id="addMoneyForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Amount</label>
                    <input type="number" id="addMoneyAmount" required min="1" placeholder="₹ Enter amount"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <button type="button" onclick="setAmount(500)"
                        class="px-4 py-2 border-2 border-indigo-600 text-indigo-600 rounded-xl font-semibold hover:bg-indigo-50">₹500</button>
                    <button type="button" onclick="setAmount(1000)"
                        class="px-4 py-2 border-2 border-indigo-600 text-indigo-600 rounded-xl font-semibold hover:bg-indigo-50">₹1000</button>
                    <button type="button" onclick="setAmount(2000)"
                        class="px-4 py-2 border-2 border-indigo-600 text-indigo-600 rounded-xl font-semibold hover:bg-indigo-50">₹2000</button>
                </div>
                <button type="submit" id="confirmAddMoneyBtn"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-xl font-bold hover:shadow-lg transition-all">Add
                    Money</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/user-wallet.js"></script>
    <script>
        function openAddMoneyModal() { document.getElementById('addMoneyModal').classList.remove('hidden'); }
        function closeAddMoneyModal() { document.getElementById('addMoneyModal').classList.add('hidden'); }
        function setAmount(val) { document.getElementById('addMoneyAmount').value = val; }
    </script>
    <script src="../js/user-sidebar.js"></script>
</body>

</html>
