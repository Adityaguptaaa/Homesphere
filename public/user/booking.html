<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - HomeSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white shadow-lg fixed left-0 top-0 bottom-0 overflow-y-auto">
            <div class="p-6">
                <h1
                    class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                    HomeSphere</h1>
                <p class="text-xs text-gray-500 mt-1">15-Min Smart Service</p>
            </div>
            <nav class="px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100"><i
                        class="fas fa-home"></i><span>Dashboard</span></a>
                <a href="booking.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white"><i
                        class="fas fa-calendar-check"></i><span>My Bookings</span></a>
                <a href="wallet.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100"><i
                        class="fas fa-wallet"></i><span>Wallet</span></a>
                <a href="subscription.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100"><i
                        class="fas fa-crown"></i><span>Subscription</span></a>

                <a href="safety.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100 border-t border-gray-200 mt-2 pt-4">
                    <i class="fas fa-shield-alt text-red-500"></i><span>Safety Center</span>
                </a>

                <a href="chatbot.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100"><i
                        class="fas fa-robot"></i><span>AI Assistant</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 overflow-y-auto">
            <header class="bg-white shadow-sm sticky top-0 z-10">
                <div class="flex items-center justify-between px-8 py-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">My Bookings</h2>
                        <p class="text-sm text-gray-500">Manage all your service bookings</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-3">
                            <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff"
                                id="userProfileImg" alt="Profile" class="w-10 h-10 rounded-full">
                            <div>
                                <p class="text-sm font-semibold text-gray-800" id="userProfileName">Loading...</p>
                                <p class="text-xs text-gray-500">User</p>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-8">
                <div class="mb-8">
                    <button onclick="openBookingModal()"
                        class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-6 py-3 rounded-xl font-bold hover:shadow-lg transition-all">
                        <i class="fas fa-plus-circle mr-2"></i>New Booking
                    </button>
                </div>

                <div class="flex space-x-2 mb-6 overflow-x-auto">
                    <button onclick="filterBookings('all')" id="btn-all"
                        class="px-6 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold whitespace-nowrap filter-btn">All
                        Bookings</button>
                    <button onclick="filterBookings('upcoming')" id="btn-upcoming"
                        class="px-6 py-2 rounded-xl bg-white text-gray-700 font-semibold hover:bg-gray-100 whitespace-nowrap filter-btn">Upcoming</button>
                    <button onclick="filterBookings('in-progress')" id="btn-in-progress"
                        class="px-6 py-2 rounded-xl bg-white text-gray-700 font-semibold hover:bg-gray-100 whitespace-nowrap filter-btn">In
                        Progress</button>
                    <button onclick="filterBookings('completed')" id="btn-completed"
                        class="px-6 py-2 rounded-xl bg-white text-gray-700 font-semibold hover:bg-gray-100 whitespace-nowrap filter-btn">Completed</button>
                    <button onclick="filterBookings('cancelled')" id="btn-cancelled"
                        class="px-6 py-2 rounded-xl bg-white text-gray-700 font-semibold hover:bg-gray-100 whitespace-nowrap filter-btn">Cancelled</button>
                </div>

                <div id="bookingsContainer" class="grid md:grid-cols-2 gap-6">
                    <div class="col-span-2 text-center py-12">
                        <i class="fas fa-spinner fa-spin text-3xl text-indigo-600 mb-4"></i>
                        <p class="text-gray-500">Loading your bookings...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Book New Service</h3>
                <button onclick="closeBookingModal()" class="text-gray-400 hover:text-gray-600"><i
                        class="fas fa-times text-xl"></i></button>
            </div>
            <form id="bookingForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Select Service</label>
                    <select id="serviceSelect" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="" disabled selected>Choose a service</option>
                        <option value="Deep Cleaning" data-price="899">Deep Cleaning - ₹899</option>
                        <option value="AC Repair" data-price="649">AC Repair - ₹649</option>
                        <option value="Plumbing" data-price="499">Plumbing - ₹499</option>
                        <option value="Electrical Work" data-price="549">Electrical Work - ₹549</option>
                        <option value="Painting" data-price="799">Painting - ₹799</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Date & Time</label>
                    <input type="datetime-local" id="bookingDate" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Address</label>
                    <textarea id="bookingAddress" rows="3" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Enter your complete address"></textarea>
                </div>
                <div class="flex justify-between items-center text-sm text-gray-600 bg-gray-50 p-3 rounded-lg">
                    <span>Estimated Cost:</span>
                    <span class="font-bold text-indigo-600 text-lg" id="estimatedCost">₹0</span>
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-xl font-bold hover:shadow-lg transition-all">Confirm
                    Booking</button>
            </form>
            <!-- Booking Modal Inner Div Closed -->
        </div>
    </div>

    <!-- Rating Modal (Moved Outside) -->
    <div id="rateModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Rate Service</h3>
                <button onclick="closeRateModal()" class="text-gray-400 hover:text-gray-600"><i
                        class="fas fa-times text-xl"></i></button>
            </div>
            <form id="rateForm" class="space-y-4">
                <input type="hidden" id="rateBookingId">
                <div class="flex justify-center space-x-2 mb-4" id="starContainer">
                    <i class="fas fa-star text-3xl text-gray-300 cursor-pointer hover:scale-110 transition-transform"
                        onclick="setRating(1)" data-value="1"></i>
                    <i class="fas fa-star text-3xl text-gray-300 cursor-pointer hover:scale-110 transition-transform"
                        onclick="setRating(2)" data-value="2"></i>
                    <i class="fas fa-star text-3xl text-gray-300 cursor-pointer hover:scale-110 transition-transform"
                        onclick="setRating(3)" data-value="3"></i>
                    <i class="fas fa-star text-3xl text-gray-300 cursor-pointer hover:scale-110 transition-transform"
                        onclick="setRating(4)" data-value="4"></i>
                    <i class="fas fa-star text-3xl text-gray-300 cursor-pointer hover:scale-110 transition-transform"
                        onclick="setRating(5)" data-value="5"></i>
                </div>
                <input type="hidden" id="ratingValue" required>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Review (Optional)</label>
                    <textarea id="rateReview" rows="3"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                        placeholder="How was your experience?"></textarea>
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white py-4 rounded-xl font-bold hover:shadow-lg transition-all">Submit
                    Rating</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/user-bookings.js"></script>
    <script src="../js/user-sidebar.js"></script>

    <script>
        function openBookingModal() { document.getElementById('bookingModal').classList.remove('hidden'); }
        function closeBookingModal() { document.getElementById('bookingModal').classList.add('hidden'); }
        document.getElementById('serviceSelect').addEventListener('change', function () {
            const price = this.options[this.selectedIndex].getAttribute('data-price');
            document.getElementById('estimatedCost').textContent = '₹' + price;
        });
    </script>
</body>

</html>
