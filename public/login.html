<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HomeSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
    class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <h1
                class="text-4xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent mb-2">
                HomeSphere
            </h1>
            <p class="text-gray-600">15-Min Smart Service</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Welcome Back!</h2>

            <form id="loginForm" class="space-y-4">
                <!-- Email Input -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="email" id="email" required
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            placeholder="Enter your email">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" required
                            class="w-full pl-12 pr-12 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            placeholder="Enter your password">
                        <button type="button" onclick="togglePassword()"
                            class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-indigo-600 hover:underline">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-xl font-bold hover:shadow-lg transition-all transform hover:scale-105">
                    Sign In
                </button>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-4">
                    <button type="button"
                        class="flex items-center justify-center space-x-2 px-4 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition-all">
                        <i class="fab fa-google text-red-500"></i>
                        <span class="text-sm font-semibold text-gray-700">Google</span>
                    </button>
                    <button type="button"
                        class="flex items-center justify-center space-x-2 px-4 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition-all">
                        <i class="fab fa-facebook text-blue-600"></i>
                        <span class="text-sm font-semibold text-gray-700">Facebook</span>
                    </button>
                </div>
            </form>

            <!-- Sign Up Link -->
            <p class="text-center text-sm text-gray-600 mt-6">
                Don't have an account?
                <a href="register.html" class="text-indigo-600 font-semibold hover:underline">Sign Up</a>
            </p>
        </div>

        <!-- Role Selection -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600 mb-3">Login as:</p>
            <div class="flex justify-center space-x-3">
                <button onclick="selectRole('user')"
                    class="px-4 py-2 bg-white rounded-lg shadow hover:shadow-md transition-all text-sm font-semibold text-gray-700">
                    <i class="fas fa-user mr-2"></i>User
                </button>
                <button onclick="selectRole('helper')"
                    class="px-4 py-2 bg-white rounded-lg shadow hover:shadow-md transition-all text-sm font-semibold text-gray-700">
                    <i class="fas fa-hands-helping mr-2"></i>Helper
                </button>
                <button onclick="selectRole('admin')"
                    class="px-4 py-2 bg-white rounded-lg shadow hover:shadow-md transition-all text-sm font-semibold text-gray-700">
                    <i class="fas fa-user-shield mr-2"></i>Admin
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        let selectedRole = 'user';

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        function selectRole(role) {
            selectedRole = role;
            console.log('Selected role:', role);

            // Update button styles
            document.querySelectorAll('[onclick^="selectRole"]').forEach(btn => {
                btn.classList.remove('bg-indigo-100', 'border-indigo-600');
                btn.classList.add('bg-white');
            });
            event.target.closest('button').classList.add('bg-indigo-100', 'border-2', 'border-indigo-600');
        }

        // Login with Email/Password
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing In...';

            try {
                const result = await loginUser(email, password);

                if (result.success) {
                    // Check if userData exists (user might not have Firestore document)
                    if (!result.userData) {
                        // User exists in Auth but not in Firestore - create document
                        console.log('Creating missing Firestore document for user...');

                        const userData = {
                            firstName: result.user.displayName ? result.user.displayName.split(' ')[0] : 'User',
                            lastName: result.user.displayName ? result.user.displayName.split(' ').slice(1).join(' ') : '',
                            email: result.user.email,
                            phone: result.user.phoneNumber || '',
                            role: selectedRole,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            walletBalance: 0,
                            totalBookings: 0,
                            subscription: null
                        };

                        await firebaseDB.collection('users').doc(result.user.uid).set(userData);

                        // Store user data in localStorage
                        localStorage.setItem('userRole', selectedRole);
                        localStorage.setItem('userName', result.user.displayName || 'User');

                        // Redirect based on selected role
                        if (selectedRole === 'user') {
                            window.location.href = 'user/dashboard.html';
                        } else if (selectedRole === 'helper') {
                            window.location.href = 'helper/dashboard.html';
                        } else if (selectedRole === 'admin') {
                            window.location.href = 'admin/dashboard.html';
                        }
                        return;
                    }

                    // Check if user role matches selected role
                    if (result.userData.role !== selectedRole) {
                        alert(`Please login as ${result.userData.role}`);
                        await logoutUser();
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'Sign In';
                        return;
                    }

                    // Store user data in localStorage
                    localStorage.setItem('userRole', result.userData.role);
                    localStorage.setItem('userName', result.user.displayName);

                    // Redirect based on role
                    if (selectedRole === 'user') {
                        window.location.href = 'user/dashboard.html';
                    } else if (selectedRole === 'helper') {
                        window.location.href = 'helper/dashboard.html';
                    } else if (selectedRole === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    }
                } else {
                    alert('Login failed: ' + result.error);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Sign In';
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred during login');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In';
            }
        });

        // Google Sign In
        async function googleSignIn() {
            try {
                const result = await signInWithGoogle();
                if (result.success) {
                    localStorage.setItem('userRole', 'user');
                    localStorage.setItem('userName', result.user.displayName);
                    window.location.href = 'user/dashboard.html';
                } else {
                    alert('Google sign-in failed: ' + result.error);
                }
            } catch (error) {
                console.error('Google sign-in error:', error);
                alert('An error occurred during Google sign-in');
            }
        }

        // Facebook Sign In
        async function facebookSignIn() {
            try {
                const result = await signInWithFacebook();
                if (result.success) {
                    localStorage.setItem('userRole', 'user');
                    localStorage.setItem('userName', result.user.displayName);
                    window.location.href = 'user/dashboard.html';
                } else {
                    alert('Facebook sign-in failed: ' + result.error);
                }
            } catch (error) {
                console.error('Facebook sign-in error:', error);
                alert('An error occurred during Facebook sign-in');
            }
        }

        // Update social login buttons
        document.addEventListener('DOMContentLoaded', function () {
            const googleBtn = document.querySelector('.fa-google').closest('button');
            const facebookBtn = document.querySelector('.fa-facebook').closest('button');

            if (googleBtn) googleBtn.onclick = googleSignIn;
            if (facebookBtn) facebookBtn.onclick = facebookSignIn;
        });
    </script>

</body>

</html>
