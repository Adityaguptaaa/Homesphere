<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Admin - HomeSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-xl max-w-md w-full text-center">
        <h1 class="text-2xl font-bold mb-4 text-purple-600">Admin Setup Tool</h1>

        <div id="status" class="mb-6 text-gray-600">Checking auth status...</div>

        <button id="promoteBtn" onclick="promoteToAdmin()" disabled
            class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Promote Me to Admin
        </button>

        <a href="login.html" class="block mt-4 text-sm text-gray-500 hover:underline">Back to Login</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        let currentUser = null;

        // Check Auth
        firebaseAuth.onAuthStateChanged(user => {
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('promoteBtn');

            if (user) {
                currentUser = user;
                statusEl.innerHTML = `Logged in as: <strong>${user.email}</strong><br>UID: ${user.uid}`;
                statusEl.classList.add('text-green-600');
                btn.disabled = false;
            } else {
                statusEl.textContent = 'Not logged in. Please login first.';
                statusEl.classList.add('text-red-600');
                btn.disabled = true;
            }
        });

        async function promoteToAdmin() {
            if (!currentUser) return;

            try {
                const btn = document.getElementById('promoteBtn');
                btn.disabled = true;
                btn.textContent = 'Updating...';

                // Update Firestore
                await firebaseDB.collection('users').doc(currentUser.uid).update({
                    role: 'admin'
                });

                // Also update localStorage
                localStorage.setItem('userRole', 'admin');

                alert('Success! You are now an Admin.');
                window.location.href = 'admin/dashboard.html';

            } catch (error) {
                console.error(error);
                alert('Error: ' + error.message);
                document.getElementById('promoteBtn').disabled = false;
                document.getElementById('promoteBtn').textContent = 'Promote Me to Admin';
            }
        }
    </script>
</body>

</html>
