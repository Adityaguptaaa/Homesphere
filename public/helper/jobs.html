<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSphere - My Jobs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-900 text-white">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 shadow-2xl fixed left-0 top-0 bottom-0 overflow-y-auto border-r border-gray-700">
            <div class="p-6">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    HomeSphere</h1>
                <p class="text-xs text-gray-400 mt-1">Helper Portal</p>
            </div>
            <nav class="px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-home"></i><span>Dashboard</span>
                </a>
                <a href="jobs.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg transition-all">
                    <i class="fas fa-tasks"></i><span>My Jobs</span>
                </a>
                <a href="earnings.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-wallet"></i><span>Earnings</span>
                </a>
                <a href="performance.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-chart-line"></i><span>Performance</span>
                </a>
                <a href="payout.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-money-bill-wave"></i><span>Payouts</span>
                </a>
                <a href="profile.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-user-circle"></i><span>Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8 overflow-y-auto">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                    <div>
                        <h1 class="text-3xl font-bold text-white">My Jobs</h1>
                        <p class="text-gray-400 mt-1">Manage your assigned service requests</p>
                    </div>
                    <div class="flex space-x-2 bg-gray-800 p-1 rounded-xl border border-gray-700">
                        <button
                            class="filter-btn px-6 py-2 rounded-lg text-sm font-semibold transition-all bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg"
                            data-filter="requests">
                            New Requests
                        </button>
                        <button
                            class="filter-btn px-6 py-2 rounded-lg text-sm font-semibold transition-all text-gray-400 hover:text-white hover:bg-gray-700"
                            data-filter="active">
                            Active Jobs
                        </button>
                        <button
                            class="filter-btn px-6 py-2 rounded-lg text-sm font-semibold transition-all text-gray-400 hover:text-white hover:bg-gray-700"
                            data-filter="history">
                            History
                        </button>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="flex flex-col justify-center items-center py-32">
                    <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-cyan-500 mb-4"></div>
                    <p class="text-gray-500 animate-pulse">Loading jobs...</p>
                </div>

                <!-- Jobs Grid -->
                <div id="jobsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden">
                    <!-- Job cards will be injected here by helper-jobs.js -->
                </div>
            </div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/helper-sidebar.js"></script>
    <script src="../js/helper-jobs.js"></script>
</body>

</html>
