<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSphere - Helper Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-900 text-white">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 shadow-2xl fixed left-0 top-0 bottom-0 overflow-y-auto border-r border-gray-700">
            <div class="p-6">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    HomeSphere</h1>
                <p class="text-xs text-gray-400 mt-1">Helper Portal</p>
            </div>
            <nav class="px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-home"></i><span>Dashboard</span>
                </a>
                <a href="jobs.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-tasks"></i><span>My Jobs</span>
                </a>
                <a href="earnings.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-wallet"></i><span>Earnings</span>
                </a>
                <a href="performance.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-chart-line"></i><span>Performance</span>
                </a>
                <a href="payout.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-money-bill-wave"></i><span>Payouts</span>
                </a>
                <a href="profile.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg transition-all">
                    <i class="fas fa-user-circle"></i><span>Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8 overflow-y-auto">
            <h1 class="text-3xl font-bold mb-6 text-white">Edit Profile</h1>

            <div id="loadingState" class="flex flex-col justify-center items-center py-32 hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-500 mb-4"></div>
                <p class="text-gray-500">Loading profile data...</p>
            </div>

            <div id="formContent"
                class="hidden max-w-2xl mx-auto bg-gray-800 rounded-xl p-8 border border-gray-700 shadow-xl">
                <form id="profileForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-gray-400 text-sm font-bold mb-2">Display Name</label>
                            <input type="text" id="helperName"
                                class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
                                placeholder="Your Name" required>
                        </div>
                        <div>
                            <label class="block text-gray-400 text-sm font-bold mb-2">Email</label>
                            <input type="email" id="helperEmail"
                                class="w-full bg-gray-700 text-gray-400 p-3 rounded-lg cursor-not-allowed" disabled>
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-400 text-sm font-bold mb-2">Phone Number</label>
                        <input type="tel" id="helperPhone"
                            class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
                            placeholder="+91 9876543210">
                    </div>

                    <div>
                        <label class="block text-gray-400 text-sm font-bold mb-2">Skills (Comma separated)</label>
                        <input type="text" id="helperSkills"
                            class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
                            placeholder="Plumbing, Electrical, Cleaning...">
                        <p class="text-xs text-gray-500 mt-1">Used for matching jobs to you.</p>
                    </div>

                    <div>
                        <label class="block text-gray-400 text-sm font-bold mb-2">Address</label>
                        <textarea id="helperAddress" rows="3"
                            class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
                            placeholder="Your Service Area / Address"></textarea>
                    </div>

                    <div class="pt-4">
                        <button type="submit"
                            class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-bold py-3 rounded-lg transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/helper-sidebar.js"></script>
    <script src="../js/helper-profile.js"></script>
</body>

</html>
