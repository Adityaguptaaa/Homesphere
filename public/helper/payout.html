<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSphere - Helper Payouts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-900 text-white">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 shadow-2xl fixed left-0 top-0 bottom-0 overflow-y-auto border-r border-gray-700">
            <div class="p-6">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    HomeSphere</h1>
                <p class="text-xs text-gray-400 mt-1">Helper Portal</p>
            </div>
            <nav class="px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-home"></i><span>Dashboard</span>
                </a>
                <a href="jobs.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-tasks"></i><span>My Jobs</span>
                </a>
                <a href="earnings.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-wallet"></i><span>Earnings</span>
                </a>
                <a href="performance.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-chart-line"></i><span>Performance</span>
                </a>
                <a href="payout.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg transition-all">
                    <i class="fas fa-money-bill-wave"></i><span>Payouts</span>
                </a>
                <a href="profile.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-user-circle"></i><span>Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8 overflow-y-auto">
            <h1 class="text-3xl font-bold mb-6 text-white">Payout Requests</h1>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Request Form -->
                <div class="lg:col-span-1">
                    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg">
                        <h2 class="text-xl font-bold mb-4 text-white">Request Withdrawal</h2>
                        <form id="payoutForm" class="space-y-4">
                            <div>
                                <label class="block text-gray-400 text-sm font-bold mb-2">Amount (₹)</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-3 text-gray-500">₹</span>
                                    <input type="number" id="payoutAmount"
                                        class="w-full bg-gray-700 text-white p-3 pl-8 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500"
                                        placeholder="0.00" min="100" required>
                                </div>
                            </div>
                            <div>
                                <label class="block text-gray-400 text-sm font-bold mb-2">Note / Bank Details</label>
                                <textarea id="payoutNote" rows="3"
                                    class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500"
                                    placeholder="e.g. Transfer to HDFC Bank..."></textarea>
                            </div>
                            <button type="submit"
                                class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-bold py-3 rounded-lg transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                                Submit Request
                            </button>
                        </form>
                    </div>
                </div>

                <!-- History Table -->
                <div class="lg:col-span-2">
                    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg">
                        <div class="p-6 border-b border-gray-700">
                            <h2 class="text-xl font-bold text-white">Request History</h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead
                                    class="bg-gray-700/50 text-gray-400 uppercase text-xs font-semibold tracking-wider">
                                    <tr>
                                        <th class="px-6 py-4">Amount</th>
                                        <th class="px-6 py-4">Date</th>
                                        <th class="px-6 py-4">Note</th>
                                        <th class="px-6 py-4">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="payoutHistoryBody" class="divide-y divide-gray-700">
                                    <!-- Dynamic content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/helper-sidebar.js"></script>
    <script src="../js/helper-payout.js"></script>
</body>

</html>
