<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSphere - Helper Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-900 text-white">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 shadow-2xl fixed left-0 top-0 bottom-0 overflow-y-auto border-r border-gray-700">
            <div class="p-6">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    HomeSphere</h1>
                <p class="text-xs text-gray-400 mt-1">Helper Portal</p>
            </div>
            <nav class="px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-home"></i><span>Dashboard</span>
                </a>
                <a href="jobs.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-tasks"></i><span>My Jobs</span>
                </a>
                <a href="earnings.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-wallet"></i><span>Earnings</span>
                </a>
                <a href="performance.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg transition-all">
                    <i class="fas fa-chart-line"></i><span>Performance</span>
                </a>
                <a href="payout.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-money-bill-wave"></i><span>Payouts</span>
                </a>
                <a href="profile.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-700 transition-all">
                    <i class="fas fa-user-circle"></i><span>Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8 overflow-y-auto">
            <h1 class="text-3xl font-bold mb-6 text-white">My Performance</h1>

            <!-- Loading State -->
            <div id="loadingState" class="flex flex-col justify-center items-center py-32 hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-500 mb-4"></div>
                <p class="text-gray-500">Loading reviews...</p>
            </div>

            <!-- Content -->
            <div id="contentState" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                    <div
                        class="bg-gray-800 rounded-xl p-8 border border-gray-700 text-center transform hover:scale-105 transition-transform duration-300">
                        <h2 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-4">Average Rating
                        </h2>
                        <div class="text-5xl font-bold text-yellow-400 mb-2" id="avgRating">0.0</div>
                        <div class="flex justify-center text-yellow-500 text-sm space-x-1">
                            <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i
                                class="fas fa-star"></i><i class="fas fa-star"></i>
                        </div>
                    </div>

                    <div
                        class="bg-gray-800 rounded-xl p-8 border border-gray-700 text-center transform hover:scale-105 transition-transform duration-300">
                        <h2 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-4">Total Reviews</h2>
                        <div class="text-5xl font-bold text-white mb-2" id="totalReviews">0</div>
                        <p class="text-gray-500 text-xs">Based on completed jobs</p>
                    </div>
                </div>

                <h3 class="text-xl font-bold text-white mb-6 flex items-center">
                    <i class="fas fa-comments mr-3 text-cyan-500"></i> Recent Feedback
                </h3>

                <div id="reviewsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Reviews injected here -->
                </div>
            </div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/helper-sidebar.js"></script>
    <script src="../js/helper-performance.js"></script>
</body>

</html>
