<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSphere - Admin Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside
            class="w-64 bg-gray-900 bg-opacity-50 backdrop-blur-xl shadow-2xl fixed left-0 top-0 bottom-0 overflow-y-auto border-r border-purple-500 border-opacity-20">
            <div class="p-6">
                <h1
                    class="text-2xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-blue-400 bg-clip-text text-transparent">
                    HomeSphere</h1>
                <p class="text-xs text-gray-400 mt-1">Admin Control Center</p>
            </div>
            <nav class="px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-chart-pie"></i><span>Dashboard</span>
                </a>
                <a href="analytics.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-chart-line"></i><span>Analytics</span>
                </a>
                <a href="users.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-users"></i><span>Users</span>
                </a>
                <a href="helpers.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-user-tie"></i><span>Helpers</span>
                </a>
                <a href="bookings.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-calendar-alt"></i><span>Bookings</span>
                </a>
                <a href="safety.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Safety Monitor</span>
                </a>
                <a href="finance.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg transition-all">
                    <i class="fas fa-rupee-sign"></i><span>Finance</span>
                </a>
                <a href="complaints.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-exclamation-circle"></i><span>Complaints</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8 overflow-y-auto">
            <h1
                class="text-3xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">
                Payout Requests</h1>

            <div id="loadingState" class="flex flex-col justify-center items-center py-32 hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mb-4"></div>
                <p class="text-gray-400">Loading requests...</p>
            </div>

            <div
                class="bg-gray-900 bg-opacity-70 rounded-2xl border border-purple-500/20 shadow-2xl overflow-hidden backdrop-blur-md">
                <div class="p-6 border-b border-purple-500/20 flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-white">Withdrawal Queue</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-purple-900/30 text-purple-200 uppercase text-xs font-semibold tracking-wider">
                            <tr>
                                <th class="px-6 py-4">Amount</th>
                                <th class="px-6 py-4">Helper ID</th>
                                <th class="px-6 py-4">Note</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4">Requested</th>
                                <th class="px-6 py-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="payoutsTableBody" class="divide-y divide-purple-500/10 text-gray-300">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/admin-finance.js"></script>
</body>

</html>
