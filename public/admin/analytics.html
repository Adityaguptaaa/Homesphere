<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSphere - Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside
            class="w-64 bg-gray-900 bg-opacity-50 backdrop-blur-xl shadow-2xl fixed left-0 top-0 bottom-0 overflow-y-auto border-r border-purple-500 border-opacity-20">
            <div class="p-6">
                <h1
                    class="text-2xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-blue-400 bg-clip-text text-transparent">
                    HomeSphere</h1>
                <p class="text-xs text-gray-400 mt-1">Admin Control Center</p>
            </div>
            <nav class="px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-chart-pie"></i><span>Dashboard</span>
                </a>
                <a href="analytics.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg transition-all">
                    <i class="fas fa-chart-line"></i><span>Analytics</span>
                </a>
                <a href="users.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-users"></i><span>Users</span>
                </a>
                <a href="helpers.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-user-tie"></i><span>Helpers</span>
                </a>
                <a href="bookings.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-calendar-alt"></i><span>Bookings</span>
                </a>
                <a href="safety.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Safety Monitor</span>
                </a>
                <a href="finance.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-rupee-sign"></i><span>Finance</span>
                </a>
                <a href="complaints.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:bg-opacity-50 transition-all">
                    <i class="fas fa-exclamation-circle"></i><span>Complaints</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8 overflow-y-auto">
            <h1
                class="text-3xl font-bold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">
                Platform Analytics</h1>

            <div id="loadingState" class="flex flex-col justify-center items-center py-32 hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mb-4"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <!-- Stat Cards -->
                <div class="bg-gray-900 bg-opacity-70 rounded-2xl p-6 border border-purple-500/20 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <i class="fas fa-users text-3xl text-purple-400"></i>
                        <span class="text-xs text-green-400 bg-green-500/10 px-2 py-1 rounded">Active</span>
                    </div>
                    <h3 class="text-gray-400 text-sm">Total Users</h3>
                    <p class="text-3xl font-bold text-white" id="totalUsers">0</p>
                </div>
                <div class="bg-gray-900 bg-opacity-70 rounded-2xl p-6 border border-pink-500/20 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <i class="fas fa-user-tie text-3xl text-pink-400"></i>
                        <span class="text-xs text-green-400 bg-green-500/10 px-2 py-1 rounded">Verified</span>
                    </div>
                    <h3 class="text-gray-400 text-sm">Total Helpers</h3>
                    <p class="text-3xl font-bold text-white" id="totalHelpers">0</p>
                </div>
                <div class="bg-gray-900 bg-opacity-70 rounded-2xl p-6 border border-blue-500/20 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <i class="fas fa-calendar-check text-3xl text-blue-400"></i>
                        <span class="text-xs text-yellow-400 bg-yellow-500/10 px-2 py-1 rounded">InProgress</span>
                    </div>
                    <h3 class="text-gray-400 text-sm">Active Bookings</h3>
                    <p class="text-3xl font-bold text-white" id="activeBookings">0</p>
                </div>
                <div class="bg-gray-900 bg-opacity-70 rounded-2xl p-6 border border-green-500/20 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <i class="fas fa-wallet text-3xl text-green-400"></i>
                        <span class="text-xs text-green-400 bg-green-500/10 px-2 py-1 rounded">+12%</span>
                    </div>
                    <h3 class="text-gray-400 text-sm">Total Revenue</h3>
                    <p class="text-3xl font-bold text-white" id="totalRevenue">₹0</p>
                </div>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-gray-900 bg-opacity-70 rounded-2xl p-6 border border-purple-500/20 shadow-lg">
                    <h3 class="text-lg font-bold mb-4">Revenue Growth</h3>
                    <canvas id="revenueChart" height="200"></canvas>
                </div>
                <!-- Add more charts if needed -->
            </div>

        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/admin-analytics.js"></script>
</body>

</html>
